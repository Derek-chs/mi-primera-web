<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marea Baja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Marea Baja</div>
  <nav>
    <a onclick="showSection('home')">Home</a>
    <a onclick="toggleMenu()">Menú</a>
    <a onclick="showSection('galeria')">Galería</a>
    <a onclick="showSection('contacto')">Contáctanos</a>
  </nav>
</header>

<section id="home" class="section home">
  <div class="overlay">
    <h1>Bienvenido a Marea Baja</h1>
    <p>Disfruta la mejor comida frente al mar</p>
    <button onclick="showSection('menu')">Ver Menú</button>
  </div>
</section>

<section id="home" class="home">
  <div class="overlay">
    <div class="contenido">
      <h1>Bienvenido a Marea Baja</h1>
      <p>Disfruta la mejor comida frente al mar</p>
      <button onclick="showSection('menu')">Ver Menú</button>
    </div>
  </div>
</section>

<section id="galeria" class="section">
  <h2>Galería</h2>

  <div class="gallery">

    <!-- SOLO CAMBIÉ ESTO -->
    <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5"
         onclick="abrirModal('Ceviche', 'Ceviche fresco con camarón y limón', this.src)">

    <img src="https://images.unsplash.com/photo-1544145945-f90425340c7e"
         onclick="abrirModal('Pescado', 'Pescado a la parrilla con vegetales frescos', this.src)">

    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"
         onclick="abrirModal('Mariscos', 'Mix de mariscos estilo Marea Baja', this.src)">

  </div>
</section>

<section id="contacto" class="section">
  <h2>Contáctanos</h2>
  <p>WhatsApp: +506 8888-8888</p>
  <button onclick="reservar()">Reservar</button>

  <iframe src="https://www.google.com/maps?q=Marea+Baja+Jaco&output=embed"></iframe>
</section>

<!-- 🔥 MODAL (NUEVO) -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="cerrar" onclick="cerrarModal()">&times;</span>
    <h2 id="titulo"></h2>
    <img id="imagen">
    <p id="descripcion"></p>
    <button onclick="reservar()">Pedir por WhatsApp</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
