<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marea Baja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Marea Baja</div>
  <nav>
    <a onclick="showSection('home')">Home</a>
    <a onclick="toggleMenu()">Menú</a>
    <a onclick="showSection('galeria')">Galería</a>
    <a onclick="showSection('contacto')">Contáctanos</a>
  </nav>
</header>

<!-- HOME -->
<section id="home" class="section home">
  <div class="overlay">
    <h1>Bienvenido a Marea Baja</h1>
    <p>Disfruta la mejor comida frente al mar</p>
    <button onclick="showSection('menu')">Ver Menú</button>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="section">
  <h2>Menú</h2>
  <div id="menuOptions" class="menu-options">
    <div>Desayuno</div>
    <div>Almuerzo</div>
    <div>Cena</div>
  </div>
</section>

<!-- GALERÍA -->
<section id="galeria" class="section">
  <h2>Galería</h2>

  <div class="gallery">

    <div class="item" onclick="abrirModal('Ceviche', 'Ceviche fresco con camarón, limón y especias', 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5')">
      <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
    </div>

    <div class="item" onclick="abrirModal('Pescado', 'Pescado a la parrilla con vegetales frescos', 'https://images.unsplash.com/photo-1544145945-f90425340c7e')">
      <img src="https://images.unsplash.com/photo-1544145945-f90425340c7e">
    </div>

    <div class="item" onclick="abrirModal('Mariscos', 'Mix de mariscos estilo Marea Baja', 'https://images.unsplash.com/photo-1504674900247-0877df9cc836')">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
    </div>

  </div>
</section>

<!-- CONTACTO -->
<section id="contacto" class="section">
  <h2>Contáctanos</h2>
  <p>WhatsApp: +506 8888-8888</p>
  <button onclick="reservar()">Reservar</button>

  <iframe src="https://www.google.com/maps?q=Marea+Baja+Jaco&output=embed"></iframe>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="cerrar" onclick="cerrarModal()">&times;</span>
    <h2 id="titulo"></h2>
    <img id="imagen" src="">
    <p id="descripcion"></p>
    <button onclick="reservar()">Pedir por WhatsApp</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
